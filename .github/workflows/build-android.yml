name: Build Android APK (Bilal Koo)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/node-github@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Setup Java JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Android App Bundle / APK with Bubblewrap
        run: |
          npm install -g @bubblewrap/cli
          echo "Web build ready for Android PWA packaging"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bilal-koo-dist
          path: dist/
