<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400">
  <defs>
    <!-- Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3d077" />
      <stop offset="50%" stop-color="#e5be58" />
      <stop offset="100%" stop-color="#c89a38" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Left Horizontal Wing Bars -->
  <g fill="url(#goldGrad)" filter="url(#shadow)">
    <rect x="80" y="135" width="80" height="24" rx="12" />
    <rect x="80" y="180" width="80" height="24" rx="12" />
    <rect x="80" y="225" width="80" height="24" rx="12" />

    <!-- Right Horizontal Wing Bars -->
    <rect x="340" y="135" width="80" height="24" rx="12" />
    <rect x="340" y="180" width="80" height="24" rx="12" />
    <rect x="340" y="225" width="80" height="24" rx="12" />

    <!-- Center Main Golden Hexagon Badge -->
    <path d="M 210,40 L 290,40 L 330,120 L 330,260 L 290,340 L 210,340 L 170,260 L 170,120 Z" fill="url(#goldGrad)" />
  </g>

  <!-- Dark Navy Emblem Arch inside Badge -->
  <path d="M 225,180 C 225,100 275,100 275,180" fill="none" stroke="#0f172a" stroke-width="16" stroke-linecap="round" />
  <path d="M 238,180 C 238,125 262,125 262,180" fill="none" stroke="#0f172a" stroke-width="10" stroke-linecap="round" />

  <!-- Brand Name: بلال كو -->
  <text x="250" y="235" font-family="'Cairo', 'Tajawal', sans-serif" font-size="38" font-weight="900" fill="#0f172a" text-anchor="middle" direction="rtl">بلال كو</text>

  <!-- English Subtitle: Bilal Koo -->
  <text x="250" y="270" font-family="sans-serif" font-size="22" font-weight="800" fill="#0f172a" text-anchor="middle" letter-spacing="2">Bilal Koo</text>

  <!-- Tagline: حيث السعر الحقيقي -->
  <text x="250" y="300" font-family="'Cairo', 'Tajawal', sans-serif" font-size="16" font-weight="800" fill="#0f172a" text-anchor="middle" direction="rtl">حيث السعر الحقيقي</text>
</svg>
